# seriouslabs-consulting.com — site du conseil iGaming de Serious Labs.
# Statique. Le formulaire est traité par le script de seriouslabs.tech
# (/var/www/seriouslabs/api/contact.php), qui reconnaît ce site à son
# SERVER_NAME et étiquette la demande « Conseil ».
#
# Les sous-domaines data. et board. ont leurs propres fichiers ; celui-ci ne
# touche qu'au domaine nu et à www.

# HTTP : tout part en HTTPS, sauf le renouvellement du certificat.
server {
    listen 80;
    listen [::]:80;
    server_name seriouslabs-consulting.com www.seriouslabs-consulting.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/seriouslabs-consulting;
    }

    location / {
        return 301 https://seriouslabs-consulting.com$request_uri;
    }
}

# www renvoie vers le domaine nu.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.seriouslabs-consulting.com;

    ssl_certificate     /etc/letsencrypt/live/seriouslabs-consulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seriouslabs-consulting.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://seriouslabs-consulting.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seriouslabs-consulting.com;

    ssl_certificate     /etc/letsencrypt/live/seriouslabs-consulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seriouslabs-consulting.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/seriouslabs-consulting;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Mêmes en-têtes que seriouslabs.tech, et pour la même raison : un seul
    # add_header dans un bloc location annule tous ceux hérités d'ici, d'où
    # expires plus bas pour le cache. HSTS sans includeSubDomains : data. et
    # board. vivent leur vie.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # Aucun style ni script en ligne ; la position de l'infobulle du graphique
    # passe par le CSSOM, que style-src n'atteint pas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    client_max_body_size 1m;

    # Le formulaire : le script de seriouslabs.tech, servi sous ce domaine.
    location = /api/contact.php {
        root /var/www/seriouslabs;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    location ^~ /assets/ {
        expires 30d;
    }

    location ^~ /assets/data/ {
        expires 1d;
    }

    # nginx 1.18 ne connaît pas woff2.
    location ^~ /assets/fonts/ {
        types { font/woff2 woff2; }
        default_type font/woff2;
        expires 365d;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
}
